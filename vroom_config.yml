cliArgs:
  geometry: true
  planmode: false
  threads: 4
  explore: 5
  limit: '1mb'
  logdir: '/..'
  logsize: '100M'
  maxlocations: 1000
  maxvehicles: 200
  override: true
  path: ''
  router: 'osrm'
  timeout: 300000
  baseurl: '/'
  port: 3000

routingServers:
  osrm:
    car:
      host: 'router.project-osrm.org'
      port: '80'
    bike:
      host: 'router.project-osrm.org'
      port: '80'
    foot:
      host: 'router.project-osrm.org'
      port: '80'