version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: royale_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
    container_name: royale_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    volumes:
      - ./backend:/app
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: royale_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    restart: unless-stopped

  vroom:
    image: vroomvrp/vroom-docker:v1.13.0
    container_name: royale_vroom
    ports:
      - 3000:3000
    environment:
      VROOM_ROUTER: osrm
      VROOM_PATH: /
    volumes:
      - ./vroom_config.yml:/conf/config.yml
    depends_on:
      - backend
    restart: unless-stopped


volumes:
  postgres_data: